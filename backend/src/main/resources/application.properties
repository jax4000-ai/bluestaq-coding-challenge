spring.application.name=notes-api
spring.r2dbc.url=r2dbc:h2:mem:///notesdb;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.r2dbc.username=sa
spring.r2dbc.password=
spring.sql.init.mode=always
spring.webflux.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=always
server.port=${PORT:8080}
# INFO covers request access logs, mutation outcomes, and audit writes.
# Set to DEBUG locally to also see per-request query/sort parameters.
logging.level.com.example.notes=INFO
